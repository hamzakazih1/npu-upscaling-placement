<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPU Load v2 — throughput reporter</title>
<style>
  body { margin:0; background:#111; color:#eee; font:13px system-ui, sans-serif; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; top:10px; left:10px; background:rgba(0,0,0,.72);
         padding:10px 14px; border-radius:6px; line-height:1.7; }
  #fps { font-size:30px; font-weight:600; }
  .k { color:#9ab; }
  #status { color:#7c7; }
  #status.bad { color:#c77; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div id="fps">--</div>
  <div><span class="k">frames / s (last 5 s)</span></div>
  <div><span class="k">load</span> <span id="load">--</span> iterations</div>
  <div><span class="k">canvas</span> <span id="size">--</span></div>
  <div><span class="k">frames</span> <span id="frames">0</span></div>
  <div id="status">connecting…</div>
</div>

<script>
// ---------------------------------------------------------------------------
// v2 of the GPU load page. Differences from benchmark/gpu_load.html, each
// fixing a defect found in the re-analysis:
//
//  1. It reports raw frame counts, page-clock timestamps and every per-frame
//     interval. The v1 page reported a rolling median of per-frame fps, which
//     snaps to vsync steps (24.0 / 20.0 fps at 120 Hz) and turned a pacing
//     change into an apparent 2.6% "cost".
//  2. The canvas has a FIXED resolution (default 1189x966, the dissertation's)
//     instead of following the window, so the GPU work per frame is the same
//     on every run and every machine.
//  3. Shader iterations can be FIXED from the URL (?iter=700). Auto-calibration
//     picks a different load each session; a fixed load is what makes two
//     sessions comparable.
//  4. It reports document.visibilityState, so throttled windows are detected
//     and rejected instead of silently averaged in (the dissertation lost 7 s
//     of one run to a 28 s stall).
//
// URL parameters:
//   iter=700        shader iterations; 0 = auto-calibrate to `target` fps
//   target=30       calibration target, used only when iter=0
//   w=1189&h=966    canvas resolution in pixels
//   port=8765       local server port
// ---------------------------------------------------------------------------

const params = new URLSearchParams(location.search);
const PORT = parseInt(params.get("port") || "8765", 10);
const REPORT_URL = `http://127.0.0.1:${PORT}/fps`;
const FIXED_ITER = parseInt(params.get("iter") || "700", 10);
const TARGET_FPS = parseFloat(params.get("target") || "30");
const WIDTH = parseInt(params.get("w") || "1189", 10);
const HEIGHT = parseInt(params.get("h") || "966", 10);
const REPORT_EVERY_MS = 500;
const CALIBRATION_MS = 6000;

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl", { antialias: false, preserveDrawingBuffer: false })
        || canvas.getContext("experimental-webgl");
if (!gl) {
  document.getElementById("status").textContent = "WebGL unavailable";
  throw new Error("no webgl");
}

// Fixed drawing-buffer size; CSS stretches it to the window. GPU cost per
// frame depends on the buffer, not on the window, so it no longer varies.
canvas.width = WIDTH;
canvas.height = HEIGHT;
gl.viewport(0, 0, WIDTH, HEIGHT);
document.getElementById("size").textContent = `${WIDTH}x${HEIGHT}`;

const vertexSrc = `
attribute vec2 pos;
void main() { gl_Position = vec4(pos, 0.0, 1.0); }
`;

// Identical shader to v1, so the workload is the one the dissertation used.
const fragmentSrc = `
precision highp float;
uniform float uTime;
uniform vec2  uRes;
uniform int   uIter;
void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 col = vec3(0.0);
  float a = 0.0;
  for (int i = 0; i < 2048; i++) {
    if (i >= uIter) break;
    float f = float(i) * 0.013 + uTime * 0.25;
    a += sin(uv.x * 9.0 + f) * cos(uv.y * 7.0 - f);
    uv = abs(uv) / dot(uv, uv) - 0.72;
    col += 0.0016 * vec3(0.55 + 0.45 * sin(a),
                         0.55 + 0.45 * sin(a + 2.1),
                         0.55 + 0.45 * sin(a + 4.2));
  }
  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSrc));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSrc));
gl.linkProgram(program);
gl.useProgram(program);

const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(program, "pos");
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(program, "uTime");
const uRes  = gl.getUniformLocation(program, "uRes");
const uIter = gl.getUniformLocation(program, "uIter");

let iterations = FIXED_ITER > 0 ? FIXED_ITER : 200;
let calibrating = FIXED_ITER <= 0;
const calibrationEnd = performance.now() + CALIBRATION_MS;
let frames = 0;
let lastFrame = performance.now();
let lastReport = performance.now();
let pendingIntervals = [];   // per-frame intervals (ms) since the last report
let hudWindow = [];          // [time, frames] pairs for the HUD only
let seq = 0;
// Identifies this page instance, so reports from a second open tab are rejected.
const PAGE_ID = Math.random().toString(36).slice(2, 10);

function post(intervals, now) {
  const body = {
    page_id: PAGE_ID,
    seq: seq++,
    t_wall: Date.now() / 1000,
    t_page_ms: now,
    frames: frames,
    intervals_ms: intervals,
    iterations: iterations,
    calibrating: calibrating,
    visibility: document.visibilityState,
    has_focus: document.hasFocus(),
    width: canvas.width,
    height: canvas.height,
    user_agent: navigator.userAgent,
  };
  fetch(REPORT_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  }).then(() => {
    const s = document.getElementById("status");
    s.textContent = calibrating ? "calibrating" : "reporting"; s.className = "";
  }).catch(() => {
    const s = document.getElementById("status");
    s.textContent = "server not reachable"; s.className = "bad";
  });
}

function frame(now) {
  const delta = now - lastFrame;
  lastFrame = now;
  frames++;
  pendingIntervals.push(Math.round(delta * 1000) / 1000);

  // Calibration (only when iter=0): mean rate over the recent intervals.
  if (calibrating && pendingIntervals.length >= 5) {
    if (now < calibrationEnd) {
      const recent = pendingIntervals.slice(-10);
      const rate = 1000 * recent.length / recent.reduce((a, b) => a + b, 0);
      if (rate > TARGET_FPS * 1.25) iterations = Math.min(2048, Math.round(iterations * 1.25));
      else if (rate < TARGET_FPS * 0.8) iterations = Math.max(10, Math.round(iterations * 0.8));
    } else {
      calibrating = false;
    }
  }

  gl.uniform1f(uTime, now * 0.001);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1i(uIter, iterations);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  hudWindow.push([now, frames]);
  while (hudWindow.length > 2 && now - hudWindow[0][0] > 5000) hudWindow.shift();

  if (now - lastReport >= REPORT_EVERY_MS) {
    const first = hudWindow[0];
    const rate = (frames - first[1]) * 1000 / Math.max(now - first[0], 1);
    document.getElementById("fps").textContent = rate.toFixed(2);
    document.getElementById("load").textContent = iterations;
    document.getElementById("frames").textContent = frames;
    post(pendingIntervals, now);
    pendingIntervals = [];
    lastReport = now;
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
